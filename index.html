<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für meinen Lieblingsmenschen ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #d63031;
            font-size: 2.2rem;
            margin-bottom: 10px;
            padding: 0 20px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }

        p {
            color: #2d3436;
            font-size: 1.2rem;
            margin-bottom: 30px;
            padding: 0 20px;
        }

        .button-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px; /* Sorgt für perfekten Abstand zwischen den Buttons */
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            flex-wrap: wrap; /* Bricht um, falls der Handy-Bildschirm extrem schmal ist */
        }

        button {
            font-size: 1.3rem;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background-color: #ff7675;
            color: white;
            z-index: 10;
            animation: pulse 2s infinite; /* Lässt den Button sanft pochen */
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 4px 20px rgba(255, 118, 117, 0.6); }
            100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 118, 117, 0.4); }
        }

        #noBtn {
            background-color: #b2bec3;
            color: #2d3436;
            /* Übergangsanimation für das Wegspringen */
            transition: top 0.2s ease-out, left 0.2s ease-out; 
        }

        #message {
            display: none;
            font-size: 1.8rem;
            color: #d63031;
            font-weight: bold;
            padding: 20px;
            animation: popIn 0.5s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .sweet-text {
            font-size: 1.3rem;
            color: #2d3436;
            margin-top: 15px;
            display: block;
            font-weight: normal;
        }

        .emoji {
            font-size: 3rem;
            margin-top: 20px;
        }

        .signature {
            font-size: 1rem; 
            color: #636e72; 
            display: block; 
            margin-top: 30px;
            font-weight: normal;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div id="questionArea">
        <h1>Liebe ich dich wirklich? 🤔</h1>
        <p>Du fragst schon wieder... hier ist die offizielle Antwort:</p>
        
        <div class="button-container">
            <button id="yesBtn">Ja, natürlich! ❤️</button>
            <button id="noBtn">Nein</button>
        </div>
    </div>

    <div id="message">
        Natürlich tue ich das! 💖<br>
        <span class="sweet-text">Du bist mein absoluter Lieblingsmensch. Ich liebe dich!</span>
        <div class="emoji">🥰 👩‍❤️‍👨 ✨</div>
        <span class="signature">In Liebe, dein Ayko</span>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionArea = document.getElementById('questionArea');
        const message = document.getElementById('message');

        function runaway() {
            // Ändert die Positionierung, damit der Button frei über den Bildschirm fliegen kann
            noBtn.style.position = 'fixed';
            
            // Berechne zufällige Positionen innerhalb des sichtbaren Bereichs
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));

            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Für Desktop (Maus-Hover)
        noBtn.addEventListener('mouseover', runaway);
        
        // Für Handy (Touch/Antippen)
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Verhindert den echten Klick
            runaway();
        });

        // Wenn sie aufgibt und "Ja" drückt
        yesBtn.addEventListener('click', () => {
            questionArea.style.display = 'none';
            message.style.display = 'block';
        });
    </script>

</body>
</html>
