<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Für meine Nervensäge ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden; /* Verhindert Scrollen, wenn der Button abhaut */
        }

        h1 {
            color: #d63031;
            font-size: 2rem;
            margin-bottom: 10px;
            padding: 0 20px;
        }

        p {
            color: #2d3436;
            font-size: 1.2rem;
            margin-bottom: 40px;
        }

        .button-container {
            position: relative;
            width: 100%;
            height: 200px;
        }

        button {
            font-size: 1.5rem;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        #yesBtn {
            background-color: #ff7675;
            color: white;
            margin-right: 20px;
            z-index: 10;
        }

        #noBtn {
            background-color: #b2bec3;
            color: #2d3436;
            position: absolute;
            transition: top 0.2s, left 0.2s; /* Macht die Flucht etwas flüssiger */
        }

        #message {
            display: none;
            font-size: 1.8rem;
            color: #d63031;
            font-weight: bold;
            padding: 20px;
            animation: popIn 0.5s ease-out forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .emoji {
            font-size: 3rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="questionArea">
        <h1>Liebe ich dich wirklich? 🙄</h1>
        <p>Du fragst schon wieder... hier ist die offizielle Antwort:</p>
        
        <div class="button-container">
            <button id="yesBtn">Ja, natürlich! ❤️</button>
            <button id="noBtn">Nein 😒</button>
        </div>
    </div>

    <div id="message">
        Natürlich tue ich das! 💖<br>
        <span style="font-size: 1.2rem; color: #2d3436;">Auch wenn du manchmal echt anstrengend bist. 😂</span><br>
        <div class="emoji">🥰 🐍 ☕</div>
        <span style="font-size: 1rem; color: #636e72; display: block; margin-top: 20px;">In Liebe, dein Ayko</span>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');
        const questionArea = document.getElementById('questionArea');
        const message = document.getElementById('message');

        // Initial position for the NO button
        noBtn.style.left = '60%';
        noBtn.style.top = '10px';

        // Funktion, um den Button abhauen zu lassen
        function runaway() {
            // Berechne zufällige Positionen innerhalb des sichtbaren Bereichs
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const randomX = Math.max(10, Math.floor(Math.random() * maxX));
            const randomY = Math.max(10, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Für Desktop (Maus)
        noBtn.addEventListener('mouseover', runaway);
        
        // Für Handy (Touch)
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault(); // Verhindert, dass der Klick registriert wird
            runaway();
        });

        // Wenn sie aufgeben muss und "Ja" drückt
        yesBtn.addEventListener('click', () => {
            questionArea.style.display = 'none';
            message.style.display = 'block';
        });
    </script>

</body>
</html>
